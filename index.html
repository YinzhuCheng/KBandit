<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KBandit 教学网页</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="container">
      <h1>K‑臂赌博机（K‑Armed Bandit）教学演示</h1>
      <p class="subtitle">设置参数，手动/策略拉杆，观察奖励与后悔值</p>
    </header>

    <main class="container grid">
      <section class="card">
        <h2>参数设置</h2>
        <div class="form-row">
          <label for="inputK">拉杆数量 K</label>
          <input type="number" id="inputK" min="1" max="50" value="5" />
        </div>
        <div class="form-row">
          <label for="inputDist">奖励分布</label>
          <select id="inputDist">
            <option value="bernoulli">伯努利（p）</option>
            <option value="gaussian">高斯（均值/标准差）</option>
          </select>
        </div>
        <div class="btn-row">
          <button id="btnGenerate" class="btn">开始游戏</button>
          <button id="btnRandomize" class="btn">随机化参数</button>
          <button id="btnApply" class="btn btn-primary">应用参数</button>
          <button id="btnReset" class="btn btn-outline">重置实验</button>
          <button id="btnToggleTruth" class="btn btn-outline">显示真值</button>
        </div>

        <div id="paramTableContainer" class="table-wrap">
          <table id="paramTable" class="table"></table>
        </div>
      </section>

      <section class="card">
        <h2>策略与运行</h2>
        <div class="form-row">
          <label for="strategySelect">策略</label>
          <select id="strategySelect">
            <option value="manual">手动</option>
            <option value="random">随机</option>
            <option value="ucb">UCB</option>
            <option value="egreedy">ε‑贪心</option>
            <option value="softmax">Softmax（温度）</option>
          </select>
        </div>
        <div class="form-row" id="strategyParamsRow" style="display:none">
          <label>策略参数</label>
          <div style="display:flex; gap:8px; flex-wrap:wrap;">
            <span id="epsilonWrap" style="display:none">ε=<input id="epsilonInput" class="small-input" type="number" step="0.01" min="0" max="1" value="0.10" /></span>
            <span id="tauWrap" style="display:none">温度 τ=<input id="tauInput" class="small-input" type="number" step="0.01" min="0.01" value="0.20" /></span>
          </div>
        </div>
        <div class="btn-row">
          <button id="btnStep1" class="btn">执行 1 步</button>
          <button id="btnStep10" class="btn">执行 10 步</button>
          <button id="btnStep100" class="btn">执行 100 步</button>
          <button id="btnStep1000" class="btn">执行 1000 步</button>
        </div>
        <p class="hint">手动模式可在参数表中对每个拉杆点击“拉一次”。</p>

        <div class="stats" id="statsPanel">
          <div><span>总步数</span><strong id="statSteps">0</strong></div>
          <div><span>累积奖励</span><strong id="statCumReward">0</strong></div>
          <div><span>平均奖励</span><strong id="statAvgReward">0</strong></div>
          <div><span>最优臂(真值)</span><strong id="statBestArm">-</strong></div>
          <div><span>最优期望奖励 μ*</span><strong id="statMuStar">-</strong></div>
          <div><span>期望后悔值</span><strong id="statRegret">0</strong></div>
        </div>
      </section>

      <section class="card">
        <h2>曲线</h2>
        <div class="charts">
          <div class="chart-item">
            <h3>累积奖励</h3>
            <canvas id="rewardChart" height="150"></canvas>
          </div>
          <div class="chart-item">
            <h3>期望后悔值</h3>
            <canvas id="regretChart" height="150"></canvas>
          </div>
        </div>
      </section>
    </main>

    <footer class="container footer">
      <p>可直接部署到 Cloudflare Pages，静态资源：<code>index.html</code>、<code>styles.css</code>、<code>app.js</code>。</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
